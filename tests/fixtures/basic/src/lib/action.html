<script>
  export let action = null;
  function $runtime(self, ctx) {
    logMsg("msg")
    if (self.onclick) {
      self.onclick = null;
    }
  }

  function logMsg(msg) {
    console.log(msg)
  }
</script>
<template>
  <button class="action" bind:onclick="action">
    <slot></slot>
  </button>
</template>
<style>
  .action {
    color: red;
  }
</style>
